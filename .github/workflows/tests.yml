name: tests

on:
  push:
    branches:
      - master
      - main
      - '*.x'
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [10.*, 11.*, 12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 10.*
            testbench: '>=8.30 <9.0.0'
          - laravel: 11.*
            testbench: '>=9.7 <10.0.0'
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          - laravel: 10.*
            php: 8.4
          - laravel: 10.*
            php: 8.5
          - laravel: 11.*
            php: 8.5

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Constrain Laravel and Testbench
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      - name: Require Pest arch plugin
        if: matrix.laravel == '10.*'
        run: composer require "pestphp/pest-plugin-arch:>=2.7 <3.0.0" --dev --no-interaction --no-update

      - name: Require Larastan for Laravel 10
        if: matrix.laravel == '10.*'
        run: composer require "larastan/larastan:>=2.11.2 <3.0.0" --dev --no-interaction --no-update

      - name: Require Guzzle 7 for Laravel 10
        if: matrix.laravel == '10.*'
        run: composer require "guzzlehttp/guzzle:>=7.8.2 <8.0.0" --no-interaction --no-update

      - name: Require Larastan for Laravel 11+
        if: matrix.laravel != '10.*'
        run: composer require "larastan/larastan:>=3.9 <4.0.0" --dev --no-interaction --no-update

      - name: Install dependencies
        env:
          # Laravel 10 and 11 still have Packagist advisories. Composer 2.9 uses audit.block-insecure; 2.10+ uses the env var.
          COMPOSER_POLICY_ADVISORIES_BLOCK: "0"
        run: |
          composer config audit.block-insecure false
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows' && matrix.laravel != '10.*'
        run: composer test:types

      - name: Test Suite
        run: composer test:unit
